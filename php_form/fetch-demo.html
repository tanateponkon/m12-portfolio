<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>fetch() demo</title>
</head>
<body>
    <h1>fetch() demo</h1>

    <!-- The POST form from form.html, but without action and method:
         JavaScript (fetch-demo.js) sends the data instead. -->
    <form id="demo-form">
        <label for="demo-name">Display name</label>
        <input id="demo-name" name="displayName">
        <button>Send with fetch()</button>
    </form>

    <p id="result">(the server's answer will appear here)</p>

    <script src="fetch-demo.js"></script>
</body>
</html>
